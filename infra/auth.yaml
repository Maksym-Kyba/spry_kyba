AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Amazon Cognito User Pool with Google social sign-in and Managed Login v2.
  Created via `make deploy-auth`.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  CognitoDomainPrefix:
    Type: String
    Description: Domain prefix for Cognito managed login (e.g. meetings-auth)
    AllowedPattern: "[a-z0-9-]+"
  GoogleClientId:
    Type: String
    Description: Google OAuth 2.0 client ID
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth 2.0 client secret
  CallbackUrls:
    Type: CommaDelimitedList
    Description: Comma-separated list of allowed redirect URIs after sign-in
  LogoutUrls:
    Type: CommaDelimitedList
    Description: Comma-separated list of allowed redirect URIs after sign-out

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${ProjectName}-users
      UserPoolTier: ESSENTIALS
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "email openid profile"
      AttributeMapping:
        email: email
        email_verified: email_verified

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: !Sub ${ProjectName}-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      SupportedIdentityProviders:
        - COGNITO
        - Google
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt UserPool.Arn
  UserPoolClientId:
    Description: App client ID for the SPA
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: Cognito Managed Login domain
    Value: !Sub ${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  Authority:
    Description: OIDC authority / issuer URL
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
