name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff & pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meetings
          POSTGRES_PASSWORD: meetings
          POSTGRES_DB: meetings
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Lint backend
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://meetings:meetings@localhost:5432/meetings
          TEST_DATABASE_URL: postgresql+asyncpg://meetings:meetings@localhost:5432/meetings_test
        run: |
          uv run pytest -v

  frontend:
    name: Frontend (lint & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm run lint
          npx prettier --check .

      - name: Build frontend
        working-directory: frontend
        run: npm run build
